spring.application.name=blog-app-backend

# Loads variables from a local ".env" file (same file/variable names the Node version used).
spring.config.import=optional:file:.env[.properties]

server.port=${PORT:4000}

# MySQL (tables are created/updated automatically on startup)
spring.datasource.url=${DB_URL:jdbc:h2:mem:blogapp;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# File upload limit (profile image) - same 2MB limit as before
spring.servlet.multipart.max-file-size=2MB
spring.servlet.multipart.max-request-size=3MB

# JWT / cookie
app.jwt.secret=${SECRET_KEY:dev-only-secret-please-set-SECRET_KEY-in-env}
app.cookie.secure=${COOKIE_SECURE:true}
app.cookie.same-site=${COOKIE_SAME_SITE:None}

# CORS (comma separated list)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,https://blog-app-ivdh.vercel.app}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:}
cloudinary.api-key=${CLOUDINARY_API_KEY:}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:}

# Optional: auto-create an ADMIN account on startup if both are set
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
app.admin.first-name=${ADMIN_FIRST_NAME:Admin}
